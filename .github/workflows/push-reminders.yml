name: Push reminders

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can run a few
    # minutes late under load — scripts/send-push.js uses a matching window
    # so a late run still catches anything due.
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # lets you fire a test run by hand from the Actions tab

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/send-push.js
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Commit updated sent-log / subscription state
        run: |
          git config user.name "discipline-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent.json data/subscription.json
          git diff --cached --quiet || git commit -m "Update push reminder state [skip ci]"
          git push
